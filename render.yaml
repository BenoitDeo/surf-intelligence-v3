services:
  - type: web
    name: surfcheck-mcp
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SURFCHECK_ACCESS_TOKEN
        generateValue: true
      - key: WINDGURU_CACHE_TTL_SECONDS
        value: 10800
      - key: WINDGURU_SPOTS_PER_BATCH
        value: 4
      - key: WINDGURU_WAVE_FALLBACK_SPOT_ID
        value: 501140
